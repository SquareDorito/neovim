##### Core settings #####
setw -g mode-keys vi
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set-option -g allow-rename off
# Auto-update window name (git branch or cwd) on this interval.
set -g status-interval 5
setw -g automatic-rename on
setw -g automatic-rename-format '#(~/.config/tmux/window-name.sh "#{pane_current_path}")'
# Forward terminal focus events to apps (nvim FocusGained/FocusLost).
set -g focus-events on

# set inactive/active window styles (subtle dimming only)
set -g window-style 'fg=colour250,bg=colour236'
set -g window-active-style 'fg=colour255,bg=colour235'
# set the pane border colors
set -g pane-border-style 'fg=colour24,bg=default'
set -g pane-active-border-style 'fg=colour51,bg=default'
if-shell -b '[ "$(tmux -V | sed -E "s/[^0-9.]//g")" \> "3.1" ]' \
  "set -g pane-border-lines simple; set -g pane-border-indicators colour"
set -g pane-border-status top
# Bold + highlighted title bar on the active pane, plain on inactive ones.
set -g pane-border-format "#{?pane_active,#[fg=colour16#,bg=colour51#,bold] #{pane_title} #[default],#[fg=colour244] #{pane_title} }"

# No X display here: send copies to the laptop clipboard via OSC 52. "on" also accepts OSC 52 from vim/nvim.
set -s set-clipboard on
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind R run-shell 'tmux source-file ~/.tmux.conf; for p in $(tmux list-panes -a -F "#{session_name}:#{window_index}.#{pane_index}"); do tmux send-keys -t "$p" "source ~/.bash_profile" Enter 2>/dev/null; done'

